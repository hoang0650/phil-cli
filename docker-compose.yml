version: '3.9'

services:
  gateway:
    image: nginx:latest
    container_name: phil_gateway
    restart: always
    ports:
      - "80:80" 
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      - api-server
    networks:
      - phil_network

  vllm-brain: # Phil-70B-Coder-N1 (DeepSeek-R1-Distill-Llama-70B trained)
    image: vllm/vllm-openai:latest
    container_name: vllm_brain
    runtime: nvidia
    restart: always
    environment: [ "CUDA_VISIBLE_DEVICES=0" ]
    command: >
      --model phil-ai/Phil-70B-Coder-N1 --quantization awq
      --dtype half --max-model-len 8192 --gpu-memory-utilization 0.50
      --port 8000 --host 0.0.0.0
    volumes: [ "./models:/root/.cache/huggingface" ]
    networks: [ "phil_network" ]

  vllm-vision: # Phil-InternVL2-76B-N1 (InternVL2-76B trained)
    image: vllm/vllm-openai:latest
    container_name: vllm_vision
    runtime: nvidia
    restart: always
    environment: [ "CUDA_VISIBLE_DEVICES=0" ]
    command: >
      --model phil-ai/Phil-InternVL2-76B-N1 --quantization awq
      --dtype half --gpu-memory-utilization 0.10 --max-model-len 4096
      --limit-mm-per-prompt image=1 --port 8001 --host 0.0.0.0
    volumes: [ "./models:/root/.cache/huggingface" ]
    networks: [ "phil_network" ]

  whisper-service: # Phil-Ear-N1 (Whisper-large-v3 trained)
    image: fedirz/faster-whisper-server:latest-cuda
    container_name: whisper_service
    runtime: nvidia
    restart: always
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - WHISPER_MODEL=phil-ai/Phil-Ear-N1
    volumes: [ "./models:/root/.cache/huggingface" ]
    networks: [ "phil_network" ]

  tts-service: # Phil-F5-TTS (F5-TTS trained)
    image: ghcr.io/coqui-ai/tts:latest
    container_name: tts_service
    runtime: nvidia
    restart: always
    environment: [ "CUDA_VISIBLE_DEVICES=0" ]
    command: "python3 -m TTS.server.server --model_name phil-ai/Phil-F5-TTS --port 8003 --use_cuda true"
    volumes: [ "./models:/root/.local/share/tts" ]
    networks: [ "phil_network" ]

  code-sandbox:
    build: 
      context: .
      dockerfile: sandbox/Dockerfile
    container_name: ai_sandbox
    command: tail -f /dev/null
    volumes:
      - ./workspace:/workspace                 # Shared storage
      - ./skills:/workspace/skills             # Skill library
      - ./mcp_servers_config.json:/workspace/mcp_servers_config.json # MCP Config
    working_dir: /workspace
    networks: [ "phil_network" ]

  db-postgres:
    image: postgres:15-alpine
    container_name: phil_db_postgres
    restart: always
    environment:
      - POSTGRES_USER=phil_admin
      - POSTGRES_PASSWORD=secure_password_change_me
      - POSTGRES_DB=phil_ai_platform
    ports:
      - "5432:5432" # Chỉ mở nếu muốn debug từ ngoài, Prod nên đóng
    volumes: [ "./postgres_data:/var/lib/postgresql/data" ]
    networks: [ "phil_network" ]

  api-server:
    build: 
      context: .
      dockerfile: sandbox/Dockerfile
    container_name: ai_api_server
    command: python3 src/api_server.py
    volumes:
      - .:/app
      - ./workspace:/workspace
      - ./skills:/app/skills
      - /var/run/docker.sock:/var/run/docker.sock # Cho phép điều khiển Sandbox
    env_file: [ ".env" ]
    depends_on: [ "vllm-brain", "vllm-vision", "whisper-service", "tts-service", "code-sandbox" ]
    networks: [ "phil_network" ]

networks:
  phil_network:
    driver: bridge