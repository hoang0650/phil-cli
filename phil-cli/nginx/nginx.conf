events {
    worker_connections 1024;
}

http {
    # 1. Rate Limiting: Giới hạn mỗi IP chỉ được gọi 10 request/giây (chống DDoS)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    server {
        listen 80;
        server_name localhost;

        # --- BẢO MẬT: BASIC AUTHENTICATION ---
        # Dòng này sẽ kích hoạt popup đăng nhập
        auth_basic "Restricted Access - Phil AI Agent";
        auth_basic_user_file /etc/nginx/.htpasswd; # Đường dẫn trong container Nginx

        # 2. Security Headers
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";

        # 3. Authentication: Kiểm tra API Key trong Header
        # Client phải gửi header: "Authorization: Bearer YOUR_SECURE_KEY"
        # (Trong thực tế nên dùng Lua script hoặc module auth_request để check DB, 
        # ở đây dùng logic check đơn giản để demo)
        
        # CORS Headers cho API
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Authorization, Content-Type";
        
        # --- ROUTING (Điều hướng) ---
        
        # Brain Coder (Phil-70B-Coder-N1)
        location /api/coder/ {
            limit_req zone=api_limit burst=20 nodelay;
            # Chỉ cho phép internal network hoặc auth hợp lệ
            proxy_pass http://vllm-brain:8000/;
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
        }

        # Vision (Phil-InternVL2-76B-N1)
        location /api/vision/ {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://vllm-vision:8001/;
        }

        # Ears (Phil-Ear-N1)
        location /api/stt/ {
            client_max_body_size 20M; # Cho phép upload file audio tới 20MB
            proxy_pass http://whisper-service:8000/;
        }

        # Mouth (Phil-F5-TTS)
        location /api/tts/ {
            proxy_pass http://tts-service:8003/;
        }
        # API Server (Backend)
        location /api/ {
            proxy_pass http://api-server:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Root endpoint - API documentation or health check
        location = / {
            proxy_pass http://api-server:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}