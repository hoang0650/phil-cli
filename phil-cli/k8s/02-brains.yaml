# ==========================================
# 3. PHIL-INTERNVL2-76B-N1 (VISION) - Port 8002
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-vision
  namespace: phil-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-vision
  template:
    metadata:
      labels:
        app: vllm-vision
    spec:
      runtimeClassName: nvidia
      containers:
      - name: vllm-vision
        image: vllm/vllm-openai:latest
        env:
        - name: CUDA_VISIBLE_DEVICES
          value: "0"
        command: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
        # SỬA LỖI CÚ PHÁP ARGS NGHIÊM TRỌNG Ở ĐÂY
        args: 
        - "--model" 
        - "phil-ai/Phil-InternVL2-76B-N1" 
        - "--quantization" 
        - "awq" 
        - "--dtype" 
        - "half" 
        - "--gpu-memory-utilization" 
        - "0.10" 
        - "--max-model-len" 
        - "4096"
        - "--limit-mm-per-prompt" 
        - "image=1" 
        - "--port" 
        - "8002"
        ports:
        - containerPort: 8002
        volumeMounts:
        - mountPath: /root/.cache/huggingface
          name: model-storage
      volumes:
      - name: model-storage
        persistentVolumeClaim:
          claimName: model-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-vision
  namespace: phil-ai
spec:
  ports:
  - port: 8002
    targetPort: 8002
  selector:
    app: vllm-vision

---
# ==========================================
# 4. PHIL-EAR-N1 (STT) - Port 8003
# ==========================================
apiVersion: apps/v1 # <--- SỬA TỪ 'kind: Service' THÀNH apps/v1 Deployment
kind: Deployment
metadata:
  name: whisper-service
  namespace: phil-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whisper-service
  template:
    metadata:
      labels:
        app: whisper-service
    spec:
      runtimeClassName: nvidia
      containers:
      - name: whisper-service
        image: fedirz/faster-whisper-server:latest-cuda
        env:
        - name: CUDA_VISIBLE_DEVICES
          value: "0"
        - name: WHISPER_MODEL
          value: "phil-ai/Phil-Ear-N1"
        ports:
        - containerPort: 8003
        volumeMounts:
        - mountPath: /root/.cache/huggingface
          name: model-storage
      volumes:
      - name: model-storage
        persistentVolumeClaim:
          claimName: model-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: whisper-service
  namespace: phil-ai
spec:
  ports:
  - port: 8002 # Whisper service port
    targetPort: 8000
    name: http
  selector:
    app: whisper-service

---
# ==========================================
# 5. PHIL-F5-TTS (TTS) - Port 8004
# ==========================================
apiVersion: apps/v1 # <--- SỬA LẠI TỪ 'kind: Service'
kind: Deployment
metadata:
  name: tts-service
  namespace: phil-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tts-service
  template:
    metadata:
      labels:
        app: tts-service
    spec:
      runtimeClassName: nvidia
      containers:
      - name: tts-service
        image: ghcr.io/coqui-ai/tts:latest
        env:
        - name: CUDA_VISIBLE_DEVICES
          value: "0"
        command: ["python3", "-m", "TTS.server.server"]
        args: 
        - "--model_name" 
        - "phil-ai/Phil-F5-TTS" 
        - "--port" 
        - "8004" 
        - "--use_cuda" 
        - "true"
        ports:
        - containerPort: 8004
        volumeMounts:
        - mountPath: /root/.local/share/tts # <--- THÊM DẤU '/' Ở ĐẦU
          name: model-storage
      volumes:
      - name: model-storage
        persistentVolumeClaim:
          claimName: model-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: tts-service
  namespace: phil-ai
spec:
  ports:
  - port: 8004
    targetPort: 8004
  selector:
    app: tts-service