# ==========================================
# 1. PHIL-70B-CODER-N1 (BRAIN) - Port 8000
# ==========================================
apiVersion: apps/v1  # <--- SỬA: apps/v1
kind: Deployment
metadata:
  name: vllm-brain
  namespace: phil-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-brain
  template:
    metadata:
      labels:
        app: vllm-brain
    spec:
      runtimeClassName: nvidia
      containers:
      - name: vllm-brain
        image: vllm/vllm-openai:latest
        env:
        - name: CUDA_VISIBLE_DEVICES
          value: "0"
        command: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
        args: 
        - "--model" 
        - "phil-ai/Phil-70B-Coder-N1" 
        - "--quantization" 
        - "awq" 
        - "--dtype" 
        - "half" 
        - "--gpu-memory-utilization" 
        - "0.50" 
        - "--port" 
        - "8000"
        ports:
        - containerPort: 8000
        volumeMounts:
        - mountPath: /root/.cache/huggingface
          name: model-storage
      volumes:
      - name: model-storage
        persistentVolumeClaim:
          claimName: model-pvc
---
apiVersion: v1
kind: Service  # <--- THÊM SERVICE ĐỂ API SERVER GỌI ĐƯỢC
metadata:
  name: vllm-brain
  namespace: phil-ai
spec:
  ports:
  - port: 8000
    targetPort: 8000
  selector:
    app: vllm-brain

